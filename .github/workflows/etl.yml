name: MIRA ETL

on:
  workflow_dispatch:
    inputs:
      source:
        description: ETL source connector.
        required: true
        default: costa_rica_sicop
      period:
        description: Period in AAAAMM format.
        required: true
  schedule:
    - cron: "20 7 3 * *"

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      MIRA_CONNECTOR_VERSION: cr-sicop-0.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set period
        id: period
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.period }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -u -d '1 month ago' +'%Y%m')" >> "$GITHUB_OUTPUT"
          fi

      - name: Set source
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.source }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=costa_rica_sicop" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e .

      - name: Init database
        run: mira-etl init-db

      - name: Run ETL
        run: mira-etl run --source "${{ steps.source.outputs.value }}" --period "${{ steps.period.outputs.value }}"
