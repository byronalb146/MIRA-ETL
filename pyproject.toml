[project]
name = "mira-etl"
version = "0.1.0"
description = "ETL configurable para normalizar datos de contrataciones publicas en MIRA."
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2.1",
  "httpx>=0.27.0",
  "ijson>=3.3.0",
]

[project.scripts]
mira-etl = "mira_etl.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
